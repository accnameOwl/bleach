<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Character Sheet</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Average+Sans:wght@500;700&display=swap');

    body {
      margin: 0;
      padding: 10px;
      background-color: #2c2c2c;
      color: #e69010;
      font-family: 'Average Sans';
      font-size:14px;
    }

    .container {
      height: 92vh;
      max-width: 300px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top {
      flex: 0 0 20%;
      display: flex;
      border: 2px solid #c06d0a;
      border-radius: 5px;
      padding: 10px;
    }

    .left-top {
      width: 30%;
      padding-right: 10px;
    }

    .right-top {
      width: 70%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-left:10px;
    }

    .name {
      font-size: 1.5em;
      font-weight: bold;
    }

    .level {
      font-size: 1em;
    }

    .bottom {
      flex: 1;
      border: 2px solid #c06d0a;
      border-radius: 5px;
      padding: 10px;
      overflow-y: auto;
    }

    .attribute {
      margin-bottom: 2px;
      color:#FFF;
    }
    /* Solid border */
    hr.rounded {
      color: #c06d0a;
      width:50%;
    }
    button {
      padding:10px 20px;
      font-size:1rem;
      cursor:pointer;
      border:none;
      border-radius:10px;
      background: #e69010;
      background: radial-gradient(circle, rgba(230, 144, 16, 1) 0%, rgba(161, 95, 0, 1) 100%);
      color:#2c2c2c;
      font-weight:bold;
    }
  </style>
</head>
<body>
